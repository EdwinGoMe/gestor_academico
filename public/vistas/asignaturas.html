<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Académico - Asignaturas</title>
    <link rel="stylesheet" href="../../src/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>
            <i class="fas fa-graduation-cap"></i>
            Panel de Administración
        </h1>
        <span class="header-badge">abc</span>
    </header>

    <!-- Contenedor principal -->
    <div class="container-fluid">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Menú de navegación</h3>
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="../index.html">
                        <i class="fas fa-home"></i>
                        Inicio
                    </a>
                </li>
                <li>
                    <a href="estudiantes.html">
                        <i class="fas fa-user-graduate"></i>
                        Estudiantes
                    </a>
                </li>
                <li>
                    <a href="asignaturas.html" class="active">
                        <i class="fas fa-book"></i>
                        Asignaturas
                    </a>
                </li>
                <li>
                    <a href="notas.html">
                        <i class="fas fa-clipboard-list"></i>
                        Notas
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Contenido principal -->
        <main class="main-content">
            <div class="content-header">
                <h2>Gestión de Asignaturas</h2>
            </div>

            <div style="margin-bottom: 20px;">
                <button id="btn-add-asignatura" class="btn-add">
                    <i class="fas fa-plus-circle"></i>
                    Agregar Asignatura
                </button>
            </div>

            <!-- Tabla de asignaturas -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Créditos</th>
                            <th>Docente</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="asignaturasBody">
                        <!-- Las filas se cargarán dinámicamente desde JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para agregar/editar asignatura -->
    <div id="asignaturaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="asignaturaModalLabel">Agregar Asignatura</h3>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="asignatura-form">
                    <div class="form-group">
                        <label for="asi-codigo">Código de Asignatura *</label>
                        <input type="text" id="asi-codigo" name="codigo" placeholder="Ej: MAT-101" required>
                    </div>
                    <div class="form-group">
                        <label for="asi-nombre">Nombre de la Asignatura *</label>
                        <input type="text" id="asi-nombre" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="asi-creditos">Créditos *</label>
                        <input type="number" id="asi-creditos" name="creditos" min="1" max="6" required>
                    </div>
                    <div class="form-group">
                        <label for="asi-docente">Docente Asignado *</label>
                        <input type="text" id="asi-docente" name="docente" required>
                    </div>
                    <div class="form-group">
                        <label for="asi-estado">Estado *</label>
                        <select id="asi-estado" name="estado" required>
                            <option value="">Seleccione un estado</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel">Cancelar</button>
                <button type="submit" form="asignatura-form" class="btn-save">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Overlay de carga -->
    <div id="loadingOverlay">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <p id="loadingMessage">Cargando...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>Derechos reservados © 2026 - Panel admin - del G1 de Programación con Java & Javascript</p>
    </footer>

    <script src="../../src/js/asignaturas.js"></script>
</body>
</html>
