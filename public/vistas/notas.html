<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Académico - Notas</title>
    <link rel="stylesheet" href="../../src/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>
            <i class="fas fa-graduation-cap"></i>
            Panel de Administración
        </h1>
        <span class="header-badge">abc</span>
    </header>

    <!-- Contenedor principal -->
    <div class="container-fluid">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Menú de navegación</h3>
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="../index.html">
                        <i class="fas fa-home"></i>
                        Inicio
                    </a>
                </li>
                <li>
                    <a href="estudiantes.html">
                        <i class="fas fa-user-graduate"></i>
                        Estudiantes
                    </a>
                </li>
                <li>
                    <a href="asignaturas.html">
                        <i class="fas fa-book"></i>
                        Asignaturas
                    </a>
                </li>
                <li>
                    <a href="notas.html" class="active">
                        <i class="fas fa-clipboard-list"></i>
                        Notas
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Contenido principal -->
        <main class="main-content">
            <div class="content-header">
                <h2>Gestión de Notas</h2>
            </div>

            <div style="margin-bottom: 20px;">
                <button id="btn-add-nota" class="btn-add">
                    <i class="fas fa-plus-circle"></i>
                    Registrar Nota
                </button>
            </div>

            <!-- Tabla de notas -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Estudiante</th>
                            <th>Asignatura</th>
                            <th>Nota</th>
                            <th>Fecha</th>
                            <th>Observación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="notasBody">
                        <!-- Las filas se cargarán dinámicamente desde JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para agregar/editar nota -->
    <div id="notaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="notaModalLabel">Registrar Nota</h3>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="nota-form">
                    <div class="form-group">
                        <label for="not-estudiante">Estudiante *</label>
                        <select id="not-estudiante" name="estudiante" required>
                            <option value="">Seleccione un estudiante</option>
                            <option value="1">Juan Pérez García</option>
                            <option value="2">María López Rodríguez</option>
                            <option value="3">Carlos Martínez Silva</option>
                            <option value="4">Ana Gómez Herrera</option>
                            <option value="5">Luis Ramírez Torres</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="not-asignatura">Asignatura *</label>
                        <select id="not-asignatura" name="asignatura" required>
                            <option value="">Seleccione una asignatura</option>
                            <option value="1">Cálculo Diferencial</option>
                            <option value="2">Física Mecánica</option>
                            <option value="3">Programación Orientada a Objetos</option>
                            <option value="4">Química General</option>
                            <option value="5">Inglés Avanzado</option>
                            <option value="6">Bases de Datos</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="not-nota">Nota *</label>
                        <input type="number" id="not-nota" name="nota" min="0" max="5" step="0.1" placeholder="0.0 - 5.0" required>
                    </div>
                    <div class="form-group">
                        <label for="not-fecha">Fecha *</label>
                        <input type="date" id="not-fecha" name="fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="not-obs">Observación</label>
                        <textarea id="not-obs" name="observacion" rows="3" placeholder="Ingrese observaciones sobre el desempeño del estudiante"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel">Cancelar</button>
                <button type="submit" form="nota-form" class="btn-save">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Overlay de carga -->
    <div id="loadingOverlay">
        <div class="loading-box">
            <div class="loading-spinner"></div>
            <p id="loadingMessage">Cargando...</p>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>Derechos reservados © 2026 - Panel admin - del G1 de Programación con Java & Javascript</p>
    </footer>

    <script src="../../src/js/notas.js"></script>
</body>
</html>
